name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (ej: v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build y Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolver tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Validar APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Guardar artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.vars.outputs.tag }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk

